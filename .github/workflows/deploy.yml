name: Deploy to Hostinger

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install NPM Dependencies & Build Assets
      run: |
        npm install
        npm run build

    - name: Install sshpass
      run: sudo apt-get update && sudo apt-get install -y sshpass

    - name: Rsync Deploy Code
      env:
        SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      run: |
        sshpass -p "$SSH_PASSWORD" rsync -avz -e "ssh -p 65002 -o StrictHostKeyChecking=no" \
          --exclude="node_modules" \
          --exclude="vendor" \
          --exclude=".git" \
          --exclude=".github" \
          --exclude=".env" \
          --exclude="storage/logs" \
          --exclude="storage/app/public/uploads" \
          ./ u335174260@145.79.213.127:/home/u335174260/domains/mkpathologylab.in/public_html/

    - name: Run SSH Post-Deployment Commands
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: "145.79.213.127"
        username: "u335174260"
        password: ${{ secrets.SSH_PASSWORD }}
        port: 65002
        script: |
          cd /home/u335174260/domains/mkpathologylab.in/public_html
          /opt/alt/php84/usr/bin/php /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction
          /opt/alt/php84/usr/bin/php artisan migrate --force
          /opt/alt/php84/usr/bin/php artisan config:cache
          /opt/alt/php84/usr/bin/php artisan route:cache
          /opt/alt/php84/usr/bin/php artisan view:cache
          chmod -R 775 storage bootstrap/cache
